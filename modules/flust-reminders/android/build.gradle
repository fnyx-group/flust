plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.fnyxgroup.flust'
version = '0.1.0'

android {
  namespace "org.fnyxgroup.flust.reminders"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  sourceSets {
    // The wall time cases shared with the JS tests.
    test.resources.srcDir "$projectDir/../../../test/fixtures"
  }
}

dependencies {
  implementation 'androidx.core:core:1.17.0'

  testImplementation 'junit:junit:4.13.2'
}
