version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # These follow the Expo SDK and are upgraded with `pnpm expo install --fix`.
    # update-types limits the ignore to version updates, so security updates still apply.
    ignore:
      - dependency-name: 'expo'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'expo-*'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@expo/*'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'eslint-config-expo'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'jest-expo'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'react'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'react-dom'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@types/react'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'react-native'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'react-native-*'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@react-native/*'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      # typescript-eslint does not support TypeScript 7 yet, and ESLint 10 breaks eslint-config-expo.
      - dependency-name: 'typescript'
        update-types: [version-update:semver-major]
      - dependency-name: 'eslint'
        update-types: [version-update:semver-major]
      - dependency-name: '@typescript-eslint/*'
        update-types: [version-update:semver-major]
      - dependency-name: 'typescript-eslint'
        update-types: [version-update:semver-major]
    groups:
      npm:
        applies-to: version-updates
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
