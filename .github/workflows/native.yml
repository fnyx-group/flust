name: Native builds

# Production builds of both apps, checked like a release. Separate from CI so that editing a pull
# request's title does not start them again. They also run weekly, so that a runner image change
# that breaks a build shows before a release. See docs/decisions/0037-ci-native-builds.md.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 2'

permissions: {}

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-paths:
    # A skipped job counts as passed for a required check, while a workflow filtered by paths would
    # leave it pending, so the builds are skipped here instead. This job must be required too:
    # when it fails, the builds are skipped.
    name: native-paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $EVENT != pull_request ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          native=$(grep -E '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.node-version|app\.json|app\.config\.ts|eas\.json|plugins/|modules/|lists/|scripts/lists/|scripts/build-lists\.ts|scripts/check-(android|ios)-release\.sh|scripts/(url-schemes|vpn-services)\.awk|licenses/|scripts/licenses/|scripts/(build|update)-licenses\.(ts|sh)|src/features/settings/third-party-licenses\.json|\.github/workflows/native\.yml)' <<<"$files" || true)
          if [[ -n $native ]]; then
            echo "Native paths changed:"
            echo "$native"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No native path changed: the builds are skipped."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  android-release:
    name: android-release
    needs: native-paths
    if: needs.native-paths.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      APP_VARIANT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # Uses the wrapper of the generated project. The cache is written from main only.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - run: pnpm expo prebuild --platform android --clean --no-install

      # The bundle for Google Play comes from the same build type, R8 and JavaScript as the APK. With
      # no upload key here, both are signed with the debug key. One ABI is enough: the manifest and
      # the dex files are the same for every ABI, and the native code of the others doubles the
      # build time. The 16 KB alignment of x86_64 is checked on the local bundle of each release.
      - name: assembleRelease bundleRelease
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease -PreactNativeArchitectures=arm64-v8a

      # Dependabot does not update bundletool: change the version and the hash together, the hash
      # taken from the release page, as for gitleaks in ci.yml.
      - name: Install bundletool
        env:
          BUNDLETOOL_VERSION: 1.18.3
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          jar="$RUNNER_TEMP/bundletool-$BUNDLETOOL_VERSION.jar"
          curl -fsSL --retry 3 -o "$jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $jar" | sha256sum --check --strict
          echo "BUNDLETOOL=$jar" >> "$GITHUB_ENV"

      - run: scripts/check-android-release.sh android/app/build/outputs/apk/release/app-release.apk

      # The bundle, then its universal APK, through the same checks. The notices of the Licenses
      # screen must match that APK, every dependency under an allowed license with its text
      # (docs/decisions/0043-third-party-licenses.md, 0046-android-bundle-and-upload-key.md).
      - run: scripts/check-android-release.sh android/app/build/outputs/bundle/release/app-release.aab

  ios-build:
    name: ios-build
    needs: native-paths
    if: needs.native-paths.outputs.changed == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APP_VARIANT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm expo prebuild --platform ios --clean --no-install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'modules/**/*.podspec') }}
          restore-keys: cocoapods-${{ runner.os }}-

      - name: pod install
        working-directory: ios
        run: pod install

      # Release for the simulator needs no signing, and bundles the JavaScript as a store build
      # does. The runner's architecture only.
      - name: xcodebuild
        working-directory: ios
        run: |
          xcodebuild build -quiet \
            -workspace flust.xcworkspace \
            -scheme flust \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO

      - run: scripts/check-ios-release.sh "$RUNNER_TEMP/derived-data/Build/Products/Release-iphonesimulator/flust.app"
