appId: org.fnyxgroup.flust
---
- runFlow: ../common/onboard.yaml
- tapOn: Journal
- tapOn: Write a note
- tapOn: Title \(optional\)
- inputText: Maestro title
- tapOn: What helped you today\?
- inputText: a walk
- hideKeyboard
- tapOn: Save
- assertVisible: .*Maestro title.*a walk.*

# Edit: the title is replaced and the list shows the new one. The short title leaves the cursor
# at its end when the wide field is tapped. A row tapped while the note screen is still closing
# is ignored, so each one waits for the animation and is tapped again if nothing changed.
- waitForAnimationToEnd
- tapOn:
    text: .*Maestro title.*
    retryTapIfNoChange: true
- assertVisible: Close
- tapOn: Maestro title
- eraseText: 20
- inputText: Edited title
- hideKeyboard
- tapOn: Save
- assertVisible: .*Edited title.*a walk.*
- assertNotVisible: .*Maestro title.*

# Delete, after the confirmation sheet.
- waitForAnimationToEnd
- tapOn:
    text: .*Edited title.*
    retryTapIfNoChange: true
# An existing note opens without the keyboard: hideKeyboard would press Back and close it.
- assertVisible: Close
- scrollUntilVisible:
    element: Delete note
- tapOn: Delete note
- assertVisible: Delete this note\?
- tapOn: Delete
- assertVisible: Nothing written yet.
