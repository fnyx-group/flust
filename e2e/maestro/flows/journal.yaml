appId: org.fnyxgroup.flust
---
- runFlow: ../common/onboard.yaml
- tapOn: Journal
- tapOn: Write a note
- tapOn: Title \(optional\)
- inputText: Maestro title
- tapOn: What helped you today\?
- inputText: a walk
# Save is in the header, above the keyboard: hideKeyboard could press Back and close the note.
- tapOn: Save
- assertVisible: '.*, Maestro title, .*a walk.*'

# Edit: the title is replaced and the list shows the new one. eraseText deletes back from the
# cursor, which lands where the field was tapped: the tap is at the field's right end, past the
# text even with large text, and the field is checked whole before saving.
# Screenshots are black under FLAG_SECURE, so waitForAnimationToEnd cannot see the note screen
# close: the flow waits for its Close button to go, and taps a row again if nothing changed.
- extendedWaitUntil:
    notVisible: Close
    timeout: 5000
- tapOn:
    text: '.*, Maestro title, .*'
    retryTapIfNoChange: true
- assertVisible: Close
- tapOn:
    text: Maestro title
    point: 97%,50%
- eraseText: 20
- inputText: Edited title
- assertVisible: Edited title
- tapOn: Save
- assertVisible: '.*, Edited title, .*a walk.*'
- assertNotVisible: .*Maestro title.*

# Delete, after the confirmation sheet.
- extendedWaitUntil:
    notVisible: Close
    timeout: 5000
- tapOn:
    text: '.*, Edited title, .*'
    retryTapIfNoChange: true
- assertVisible: Close
- scrollUntilVisible:
    element: Delete note
- tapOn: Delete note
- assertVisible: Delete this note\?
- tapOn: Delete
- assertVisible: Nothing written yet.
