pre-commit:
  piped: true
  jobs:
    - name: checks
      group:
        parallel: true
        jobs:
          - name: prettier
            glob: '*.{js,mjs,cjs,ts,tsx,json,md,yml,yaml}'
            run: pnpm prettier --check --ignore-unknown {staged_files}
          - name: eslint
            glob: '*.{js,mjs,cjs,ts,tsx}'
            run: pnpm eslint --max-warnings 0 {staged_files}
          - name: typecheck
            run: pnpm tsc --noEmit
    - name: gitleaks
      run: gitleaks git --staged --redact --no-banner

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}
